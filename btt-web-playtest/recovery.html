<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090706">
  <title>Beneath the Throne Recovery</title>
  <style>
    html,body{margin:0;min-height:100%;background:#020303;color:#f1dec0}
    body{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:22px;
      box-sizing:border-box;
      background:
        linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.88)),
        url("./assets/tutorial/generated/v80/title-bg-mobile-v80.webp") center/cover no-repeat,
        #020303;
      font-family:Georgia,"Times New Roman",serif;
      text-align:center;
    }
    main{
      width:min(430px,100%);
      padding:18px 16px;
      border:1px solid rgba(208,153,73,.42);
      border-radius:8px;
      background:rgba(4,5,5,.8);
      box-shadow:0 18px 46px rgba(0,0,0,.68);
    }
    span{
      display:block;
      margin-bottom:7px;
      color:#d9a451;
      font:800 11px/1 system-ui,sans-serif;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    h1{margin:0 0 8px;font-size:34px;line-height:.95}
    p{margin:0 0 14px;color:#dbc4a0;font:700 13px/1.35 system-ui,sans-serif}
    a,button{
      display:block;
      width:100%;
      box-sizing:border-box;
      min-height:42px;
      margin-top:8px;
      padding:12px;
      border:1px solid rgba(218,162,81,.52);
      border-radius:6px;
      background:linear-gradient(180deg,#65401f,#27150c);
      color:#ffe8bd;
      font:900 14px/1 system-ui,sans-serif;
      text-decoration:none;
    }
    button.secondary{background:linear-gradient(180deg,#30302c,#111)}
  </style>
</head>
<body>
  <main>
    <span>Phone Playtest</span>
    <h1>Recovery</h1>
    <p id="status">Clearing old app cache...</p>
    <a id="openGame" href="./index.html">Open Game</a>
    <button class="secondary" onclick="recover()">Run Recovery Again</button>
  </main>
  <script>
    async function recover(){
      const status = document.getElementById("status");
      status.textContent = "Clearing old app cache...";
      try{
        if("caches" in window){
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith("beneath-throne-")).map(key => caches.delete(key)));
        }
        if(navigator.serviceWorker?.getRegistrations){
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        const next = new URL("./index.html", location.href);
        next.searchParams.set("fresh", Date.now());
        document.getElementById("openGame").href = next.href;
        status.textContent = "Recovery complete. Open the game again.";
      }catch(error){
        console.warn("Recovery failed", error);
        status.textContent = "Recovery hit a browser error. Try closing and reopening the browser, then run this page again.";
      }
    }
    recover();
  </script>
</body>
</html>
